services:
  # Backend: FastAPI
  - type: web
    name: citycare-api
    env: python
    rootDir: backend
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn core.apis.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: citycare_clinic
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: https://citycare-frontend.onrender.com,http://localhost:5173
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_PUBLIC_BASE_URL
        value: https://citycare-api.onrender.com

  # Frontend: Vite/React static site
  - type: web
    name: citycare-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install -g pnpm && pnpm install && pnpm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://citycare-api.onrender.com
      - key: VITE_TELEGRAM_BOT_USERNAME
        value: CityCareMediHubBot
      - key: NODE_VERSION
        value: "20"
